name: Bug report
description: Report a reproducible problem in LuminRAG.
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not include API keys, workspace IDs, private documents or workspace backups. Report security vulnerabilities through the security policy."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using non-sensitive material.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, commit, and hosted or self-hosted mode.
    validations:
      required: true
