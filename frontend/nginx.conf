server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://openrouter.ai; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Shared backend proxy settings, including the browser's original port.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Stream uploads to the backend so authentication runs before nginx buffers
    # the body. Allow the default maximum batch (20 x 64 MiB) plus form overhead.
    # Increase this bound too if LUMINRAG_MAX_UPLOAD_BYTES is raised.
    location = /api/ingest {
        client_max_body_size 1281m;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
    }

    location = /api/workspace/import {
        client_max_body_size 257m;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Generated illustration images served by the backend
    location /static/illustrations/ {
        proxy_pass http://backend:8000;
    }

    # Serve the React SPA — fall back to index.html for client-side routes
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
