server {
    # The dedicated tunnel, frontend and backend share one network namespace.
    # Nothing listens on the server's LAN or public interfaces.
    listen 127.0.0.1:8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    # Only the local cloudflared connector supplies the visitor address.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://openrouter.ai; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace visitor-supplied forwarding chains with the verified address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location = /api/ingest {
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/workspace/import {
        client_max_body_size 257m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/illustrations/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
